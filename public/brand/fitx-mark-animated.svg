<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <style>
    path { stroke: currentColor; stroke-width: 5.5; stroke-linecap: square; stroke-linejoin: miter; stroke-dasharray: 64; stroke-dashoffset: 64; animation: form 520ms cubic-bezier(.2,.8,.2,1) forwards; }
    #spine { animation-delay: 90ms; }
    #crossbar { animation-delay: 180ms; }
